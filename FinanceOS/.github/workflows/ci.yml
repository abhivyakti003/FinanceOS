name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: financeos
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: financeos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U financeos" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-postgres.txt ruff
      - name: Lint
        run: ruff check .
      - name: Tests (SQLite)
        run: pytest -q
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://financeos:testpass@localhost:5432/financeos_test
        run: pytest -q
      - name: Migrations apply cleanly on a fresh PostgreSQL database
        env:
          PGPASSWORD: testpass
          DATABASE_URL: postgresql://financeos:testpass@localhost:5432/financeos_migrate
          SECRET_KEY: ci-only-secret
        run: |
          psql -h localhost -U financeos -d financeos_test -c "CREATE DATABASE financeos_migrate"
          python -m app.database.init_db
          alembic downgrade base
          alembic upgrade head
