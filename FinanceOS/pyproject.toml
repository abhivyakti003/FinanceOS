[project]
name = "financeos"
version = "1.0.0"
description = "Personal finance tracker for India: accounts, spending, investments, bills and goals."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "E501",    # long lines are fine for UI strings
  "S101",    # assert in tests
  "S311",    # random is only used for mock sample data
  "B008",
  "S608",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "B017"]
"pages/*" = ["I001"]
